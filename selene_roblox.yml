# Minimal Roblox globals for Selene in environments that cannot download Roblox's API dump.
# On a PC with internet, `selene generate-roblox-std` and `std = "roblox"` give stricter checks.
base: luau
name: roblox_min
globals:
  game: { any: true }
  workspace: { any: true }
  script: { any: true }
  plugin: { any: true }
  shared: { any: true }
  Enum: { any: true }
  Instance: { any: true }
  Vector2: { any: true }
  Vector3: { any: true }
  CFrame: { any: true }
  Color3: { any: true }
  UDim: { any: true }
  UDim2: { any: true }
  Ray: { any: true }
  RaycastParams: { any: true }
  OverlapParams: { any: true }
  PhysicalProperties: { any: true }
  NumberSequence: { any: true }
  NumberSequenceKeypoint: { any: true }
  ColorSequence: { any: true }
  ColorSequenceKeypoint: { any: true }
  NumberRange: { any: true }
  TweenInfo: { any: true }
  Random: { any: true }
  Region3: { any: true }
  BrickColor: { any: true }
  DateTime: { any: true }
  task: { any: true }
  buffer: { any: true }
  bit32: { any: true }
  typeof: { any: true }
  tick: { any: true }
  warn: { any: true }
  wait: { any: true }
  delay: { any: true }
  spawn: { any: true }
  utf8: { any: true }
  debug: { any: true }
